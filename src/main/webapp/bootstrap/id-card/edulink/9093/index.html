<!DOCTYPE html>
<html>
<head>
    <title>Bhim-ma-vi</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .id-card {
            width: 2.125in;
            height: 3.375in;
            border: 2px solid #000;
            margin: 20px;
            padding: 10px;
            text-align: center;
            background-color: #f3f3f3;
        }

    </style>
</head>
<body>
<div id="body"></div>

<script>
    const idCardPrintRegNo = localStorage.getItem("idCardPrintRegNo");
    const tillDate = localStorage.getItem("tillDate");
    const path = localStorage.getItem("context-path");

    $.ajax({
        type: "GET",
        url: path + "/api/Student/IDCardPrint/" + idCardPrintRegNo,
        headers: {'Authorization': localStorage.getItem("token")},
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        success: function (data) {
            const orgName = "BHIM SECONDARY SCHOOL";
            const address = "BHIMESHWOR-2, DOLKHA";
            const telNo = "049412028";
            const regNo = [];
            let photo;
            data.forEach((emp) => {
                photo = emp.photo;
                if (photo.length > 5) photo = localStorage.getItem('document-path') + photo
                else photo = "";

                regNo.push(emp.regNo);
                $("#body").append(`
    <div class="id-card">
        <div style="height: 60px;">
            <div style=" width: 20%; float: left;height: 60px; margin-top: -10px">
                <img src="https://softwareghar.com/bhimmaviDocument/Organization/Logo.png" height="50"
                     width="50">
            </div>
            <div style="width: 79%; float: right">
                <b style="color: blue">` + orgName + `</b>

             </div>
        </div>
        <div style="clear: both"></div>
              <div style="margin-top: -30px;padding-left: -100px">
                <div style=""><b style="font-size: 10px;">` + address + `</b></div>
                <div><b style="font-size: 10px;">PHONE: ` + telNo + `</b></div>
</div>
   <div style="clear: both"></div>
        <div style="background-color: red;color: white; margin-bottom: 5px;">STUDENT's ID CARD</div>
        <div style="clear: both"></div>
        <div style="height: 60px;">
            <div style=" width: 49%; float: left;height: 60px;">
                <img src="` + photo + `" height="90" width="90" alt="PHOTO" style="margin-left: -50px;">
                  <img src="https://softwareghar.com/bhimmaviDocument//Organization/principleSignature.png"
                     height="40" width="40" style="margin-top: -10px; margin-left: -101px;">
            </div>
            <div style="width: 49%; float: right">
                <div id="qrcode` + emp.regNo + `" style="padding-left: 10px"></div>

            </div>
        </div>
        <div style="clear: both"></div>

        <div style="font-size: 12px;text-align: left; margin-top: 10px;">
            <div style="margin-top: 3px;"><b>NAME:</b> ` + emp.studentName + `</div>
               <div style="margin-top: 3px;margin-bottom: 3px"><b>REG NO:</b> ` + emp.regNo + ` <b>ROLL NO:</b> ` + emp.rollNo + ` </div>
              <div style="margin-top: 3px;"><b>FATHER:</b> ` + emp.fathersName + `</div>
            <div style="margin-top: 3px;margin-bottom: 3px"><b>LEVEL:</b> ` + emp.className + ` </div>
               <div style="margin-top: 3px;margin-bottom: 3px"><b>MOBILE No:</b> ` + emp.mobileNo + ` </div>

             <div style="clear: both"></div>
            <div style="text-align: left">

                <div style="margin-top: 0px;"><b>DATE OF BIRTH:</b>` + emp.dob + `</div>
                <div style="margin-top: 0px; color: red"><b>VALID UPTO:</b> ` + tillDate + `</div>
            </div>
            <div style="clear: both"></div>
            <div style="text-align: center; font-size: 9px; margin-top: 5px; background-color: black; color: white;">
             IF FOUND, PLEASE RETURN TO THE SCHOOL
            </div>


            <div style="clear: both"></div>
        </div>
    </div><div style="page-break-after: always"></div>`)

            });
            regNo.forEach((stu) => {
                generateQr("qrcode" + stu, stu);
            });
        }
    });


    function generateQr(div, id) {
        new QRCode(document.getElementById(div), {text: id, height: 90, width: 90});
    }
</script>

</body>
</html>
