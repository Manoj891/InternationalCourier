<!DOCTYPE html>
<html>
<head>
    <title>chaitanyan-college</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .id-card {
            width: 2.125in;
            height: 3.375in;
            border: 2px solid #000;
            margin: 20px;
            padding: 10px;
            text-align: center;
            background-color: #f3f3f3;
            background-image: url('chaitanyanCollege.png');
            background-size: cover; /* or use 'contain' depending on your requirement */
            background-repeat: no-repeat;
            background-position: center;
        }


    </style>
</head>
<body>
<div id="body" style="margin-left: -30px;margin-top: -30px ">

</div>

<script>
    const idCardPrintRegNo = localStorage.getItem("idCardPrintRegNo");
    const tillDate = localStorage.getItem("tillDate");
    const path = localStorage.getItem("context-path");
    const URL = path + "/api/Student/IDCardPrint/" + idCardPrintRegNo;
    $.ajax({
        type: "GET",
        url: URL,
        headers: {'Authorization': localStorage.getItem("token")},
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        success: function (student) {
            const regNo = [];
            let photo;
            student.forEach((stu) => {
                photo = stu.photo;
                if (photo.length > 5) photo = localStorage.getItem('document-path') +photo
                else photo = "";
                regNo.push(stu.regNo);
                $("#body").append(`
    <div class="id-card">

        <div style="height: 60px;">
            <div style=" width: 20%; float: left;height: 60px;">

            </div>
            <div style="width: 79%; float: right">
                <b style="color: blue"></b>
                <div><b style="font-size: 10px;"></div>
                <div><b style="font-size: 10px;"></div>
             </div>
        </div>
        <div style="clear: both"></div>

        <div style="margin-bottom: 20px;"></div>
        <div style="clear: both"></div>
        <div style="height: 60px; margin-left: 40px;">
            <div style="width: 49%; float: left;height: 60px;">
                <img src="` + photo + `" height="80" width="80" alt="PHOTO">

            </div>
            <div style="width: 49%; float: right">
                <div id="qrcode` + stu.regNo + `" style="padding-left: 10px"></div>

            </div>
        </div>
        <div style="clear: both"></div>

        <div style="font-size: 9px;text-align: left;margin-left: 40px; margin-top: 10px;">
            <div style=" margin-top: 1px;"><b>NAME:</b> ` + stu.studentName.toUpperCase() + `</div>
            <div style=" margin-top: 1px;"><b>ADDRESS:</b> ` + stu.address.toUpperCase() + `</div>
               <div style=" margin-top: 1px;"><b>DATE OF BIRTH:</b> ` + stu.dob + `</div>
            <div style=" margin-top: 1px;"><b>LEVEL:</b> ` + stu.program.toUpperCase() + ` ` + stu.className.toUpperCase() + `</div>
           <div style=" margin-top: 1px;"><b>ROLL NO:</b> ` + stu.rollNo + `</div>
             <div style=" margin-top: 1px;"><b>REG NO:</b> ` + stu.regNo + `</div>
              <div style=" margin-top: 1px; color: red"><b>VALID UPTO:</b> ` + tillDate + `</div>
                     <div style=" margin-top: 1px;"><b>SUBJECT:</b> ` + stu.subject + `</div>
            </div>
            <div style="clear: both"></div>



            <div style="clear: both"></div>
        </div>
    </div><div style="page-break-after: always"></div>`)

            });
            regNo.forEach((stu) => {
                generateQr("qrcode" + stu, stu);
            });
        }
    });


    function generateQr(div, id) {
        new QRCode(document.getElementById(div), {text: id, height: 80, width: 80});
    }
</script>

</body>
</html>
